

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  agents:
    build: ./agents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AGENTS_HOST: ${AGENTS_HOST}
      OLLAMA_URL: ${OLLAMA_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS}
      DEDUP_MERGE_THRESHOLD: ${DEDUP_MERGE_THRESHOLD}
      DEDUP_REVIEW_THRESHOLD: ${DEDUP_REVIEW_THRESHOLD}
      DEDUP_MISSED_POLL_LIMIT: ${DEDUP_MISSED_POLL_LIMIT}
      DEDUP_STALE_AFTER_DAYS: ${DEDUP_STALE_AFTER_DAYS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_SCORE_MODEL: ${LLM_SCORE_MODEL}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL}
      SCORE_PROMPT_VERSION: ${SCORE_PROMPT_VERSION}
      RUN_BUDGET_USD: ${RUN_BUDGET_USD}
      MAX_LLM_CALLS_PER_RUN: ${MAX_LLM_CALLS_PER_RUN}
      LLM_MAX_TOKENS_SCORE: ${LLM_MAX_TOKENS_SCORE}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES}
      LLM_RETRY_BASE_SECONDS: ${LLM_RETRY_BASE_SECONDS}
      LLM_RETRY_MAX_SECONDS: ${LLM_RETRY_MAX_SECONDS}
      LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK}
      LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK}
      LLM_PRICE_CACHE_READ_PER_MTOK: ${LLM_PRICE_CACHE_READ_PER_MTOK}
      LLM_PRICE_CACHE_WRITE_PER_MTOK: ${LLM_PRICE_CACHE_WRITE_PER_MTOK}
      GATE1_SHORTLIST_SIZE: ${GATE1_SHORTLIST_SIZE}
      AUTO_FORWARD_TOP_N: ${AUTO_FORWARD_TOP_N}
      PREFILTER_TERMS: ${PREFILTER_TERMS}
      PREFILTER_LOCATIONS: ${PREFILTER_LOCATIONS}
    ports:
      - "${AGENTS_PORT}:8000"

  workflow:
    build: ./workflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      JDBC_DATABASE_URL: ${JDBC_DATABASE_URL}
      JDBC_DATABASE_USER: ${JDBC_DATABASE_USER}
      JDBC_DATABASE_PASSWORD: ${JDBC_DATABASE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${WORKFLOW_PORT}:8080"

  web:
    build: ./web
    environment:
      VITE_WORKFLOW_URL: ${VITE_WORKFLOW_URL}
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  pgdata:
