[project]
name = "offerradar-agents"
version = "0.1.0"
description = "OfferRadar agent service: LangGraph supervisor, scout, matcher, recon, scribe"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    # robots.txt parsing. urllib.robotparser is stdlib but blocking and does
    # not handle wildcards or crawl-delay; Protego is what Scrapy uses.
    "protego>=0.3",
    "pgvector>=0.5.1",
    "anthropic>=0.70",
]

# PEP 735 dependency group, not an optional-dependencies extra: `uv sync`
# installs this by default, so a fresh clone can run the tests immediately,
# while `uv sync --no-dev` in the runtime image leaves it out.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    # Container-backed tests: "running Scout twice adds zero rows" is a claim
    # about real ON CONFLICT against real constraints. Pinned recent because
    # the CI runner's Docker Engine rejects clients below API 1.40.
    "testcontainers[postgres]>=4.9",
    "psycopg[binary]>=3.2",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerradar_agents"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# Jitter is not cryptographic.
"src/offerradar_agents/scout/retry.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["offerradar_agents"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# No live network and no LLM calls in tests (AGENTS.md §2 rule 5).
addopts = "-q --strict-markers"
markers = ["integration: needs a Docker daemon (Postgres container)"]
