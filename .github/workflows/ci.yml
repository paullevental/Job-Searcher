# CI is the only non-bypassable gate: pre-commit hooks are client-side and
# `--no-verify` defeats them. Jobs call Makefile targets so CI and local cannot drift.
# Actions are pinned to a commit SHA, not a mutable tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- gate 1: secrets ------------------------------------------------------
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks walks history; the default shallow clone would hide older commits.
          fetch-depth: 0

      - name: gitleaks
        # Digest-pinned: GHCR does not enforce tag immutability.
        # Uses the repo's .gitleaks.toml; the default ruleset misses Anthropic keys.
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  # --- gate 2: repo rules ---------------------------------------------------
  guards:
    name: repo rule guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit (all files)
        # The gitleaks hook no-ops here (its entry is `--staged`); the `secrets` job covers it.
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  # --- per-stack lint and test ----------------------------------------------
  agents:
    name: agents (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12" # §5
          enable-cache: true
          cache-dependency-glob: agents/uv.lock

      - name: Install (locked)
        # --frozen fails if uv.lock disagrees with pyproject.toml.
        run: uv sync --frozen
        working-directory: agents

      - name: Lint (ruff + mypy --strict)
        run: make lint-agents

      - name: Test (pytest)
        run: make test-agents

  workflow:
    name: workflow (java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        # gradle-wrapper.jar is a committed binary the build executes.
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21" # §5

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the cache, so a PR cannot poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (Spotless)
        # Not `make lint-workflow`: that target runs Gradle in Docker, redundant here.
        run: ./gradlew --no-daemon spotlessCheck
        working-directory: workflow

      - name: Test (JUnit)
        run: ./gradlew --no-daemon test
        working-directory: workflow

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-test-report
          path: workflow/build/reports/tests/test/
          retention-days: 7

  web:
    name: web (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # matches web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (locked)
        # npm ci fails if package.json has drifted from the lockfile.
        run: npm ci
        working-directory: web

      - name: Lint (ESLint + Prettier + tsc)
        run: make lint-web

      - name: Test (Vitest)
        run: make test-web
