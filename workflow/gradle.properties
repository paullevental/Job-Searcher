# Heap is capped because workflow/Dockerfile copies this file: the in-image
# Gradle build runs in a <4 GiB Docker VM, where an unbounded JVM kills the daemon.
# The host daemon's JDK is pinned separately, by gradle/gradle-daemon-jvm.properties.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
