# Memory is bounded deliberately, not left to Gradle's defaults.
#
# The build runs inside a container (workflow/Dockerfile, and `make
# lint-workflow` / `make test-workflow`), so it is capped by the Docker VM
# rather than by the host. On a default Docker Desktop VM that is under 4 GiB
# shared with everything else, an unbounded Gradle JVM plus javac plus the test
# JVM is enough to kill the whole daemon mid-build.
#
# These values also make CI deterministic: the same heap on a GitHub runner as
# on a laptop, so an out-of-memory failure cannot depend on where it ran.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m

# One Spring Boot module. Parallel execution and extra workers buy nothing here
# and each worker is another JVM.
org.gradle.parallel=false
org.gradle.workers.max=2

# Safe inside a container: the cache lives in the image layer or the mounted
# volume, and is keyed on task inputs.
org.gradle.caching=true
