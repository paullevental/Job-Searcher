plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.offerradar'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Flyway owns the schema (AGENTS.md §6). JPA is read/write only and runs
    // with ddl-auto=validate so a drifted entity fails the build, never the DB.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // runtimeOnly above puts the driver on the runtime path only; the schema tests
    // need PSQLException at compile time to read which constraint a failure names.
    testImplementation 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
    }
}

spotless {
    java {
        googleJavaFormat('1.24.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// bootJar only. Without this, `gradle build`/`assemble` also emits
// workflow-<ver>-plain.jar, and the Dockerfile's COPY build/libs/*.jar glob
// would match two files and fail the image build.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    // Sizes the forked test JVM, which gradle.properties does not: org.gradle.jvmargs
    // there sizes the daemon. Left implicit this would be Gradle's 512m.
    maxHeapSize = '768m'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
