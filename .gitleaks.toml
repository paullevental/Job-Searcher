# gitleaks configuration.
#
# The default ruleset does NOT detect Anthropic API keys, which is the one
# credential this project actually holds (AGENTS.md §9). Verified against
# gitleaks 8.x: a well-formed `sk-ant-api03-...` key scans clean with defaults.
# So the defaults are extended rather than replaced.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{40,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "anthropic-api-key-loose"
description = "Anthropic key prefix with any long opaque tail"
regex = '''sk-ant-[A-Za-z0-9_\-]{32,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "offerradar-model-key-assignment"
description = "A model key assigned to a literal instead of read from the environment"
regex = '''(?i)(ANTHROPIC_API_KEY|OPENAI_API_KEY|OLLAMA_API_KEY)\s*[:=]\s*["']([^"'\s$]{16,})["']'''
# The secret is group 2, not the variable name. Without this, --redact hides the
# variable name and prints the key itself into hook and CI output (§9).
secretGroup = 2
keywords = ["anthropic_api_key", "openai_api_key", "ollama_api_key"]

[allowlist]
description = "Placeholders and documentation are not secrets"
paths = [
  '''\.env\.example$''',
  '''^docs/''',
  '''^AGENTS\.md$''',
  '''^README\.md$''',
  '''^\.gitleaks\.toml$''',
]
regexes = [
  '''REPLACE-ME''',
  '''replace-me''',
  '''sk-ant-REPLACE-ME''',
]
